<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title> Math test</title>
  </head>
  <body>


   <header>
     <h1>math quiz</h1>
  </header>


    <main>
      <form>
        <p>
          <label>Name</label>
          <input type="text" name="name" required>
        </p>

        <<fieldset>
          <legend>Math evaluation </legend>

          <p><strong>question 1</strong> what is 5 &times; 5?</p>
          <p>
            <input type="radio" name="q1" value="a"> 10<br>
            <input type="radio" name="q1" value="b"> 20<br>
            <input type="radio" name="q1" value="c"> 25<br>
            <input type="radio" name="q1" value="d"> 30
          </p>

          <p><strong>Question 2:</strong> what is 12 &divide; 4?</p>
          <p>
            <input type="radio" name="q2" value="a"> 2<br>
            <input type="radio" name="q2" value="b"> 3<br>
            <input type="radio" name="q2" value="c"> 4<br>
            <input type="radio" name="q2" value="d"> 6

          </p>


          <p><strong>question 3:</strong>what is the &radic;9?</p>
          <p>
            <input type="radio" name="q3" value="a"> 3<br>
            <input type="radio" name="q3" value="b"> 9<br>
            <input type="radio" name="q3" value="c"> 18<br>
            <input type="radio" name="q3" value="d"> 81
          </p>

          <p><strong>question 4:</strong>if john has 3 apples and buys 4 more,how many does he have in total? Explain</p>
          <p>
            <textarea name="word_problem" rows="4" cols="40" placeholder="type your answer here..."></textarea>
          </p>

        </fieldset>


          <p>
            <button type="submit">Submit test</button>
          </p>
      </form>
    </main>

  </body>
</html>
